<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TimeFrames</title>
<style>
body { max-width: 960px; margin: auto; padding: 16px; background: #fff; color: #222; font: 15px sans-serif; }
h1 { font-size: 18px; overflow-wrap: anywhere; }
video, audio { display: block; width: 100%; max-height: 54vh; }
#tracks { --at: 0%; }
.name { margin-top: 16px; color: #666; font-size: 13px; overflow-wrap: anywhere; }
.bar { position: relative; height: 28px; margin: 4px 0; background: #eee; cursor: pointer; }
.bar i { position: absolute; top: 0; bottom: 0; min-width: 1px; }
.bar::after { content: ""; position: absolute; top: 0; bottom: 0; left: var(--at); width: 2px; background: #000; pointer-events: none; }
.legend span { margin-right: 14px; font-size: 13px; }
.legend b { padding-right: 12px; margin-right: 5px; }
</style>
<h1 id="title"></h1>
<div id="player"></div>
<p id="notice" hidden><span></span><br><input type="file"></p>
<div id="tracks"></div>
<script>
const DATA = /*__DATA__*/null;
const COLORS = ['#4c8bd6', '#e4572e', '#3aa76d', '#b65fcf', '#e0a100', '#17a2b8', '#d6336c', '#7a8b99'];
const notice = document.querySelector('#notice');
const picker = notice.querySelector('input');
const player = document.createElement(DATA.kind);
const labels = [...new Set(DATA.tracks.flatMap(t => t.segments.map(s => s.label)))];
const color = label => COLORS[labels.indexOf(label) % COLORS.length];
const percent = ms => `${ms / DATA.duration_ms * 100}%`;
const expected = DATA.file_name ? `"${DATA.file_name}"` : `the ${DATA.kind} file`;

function add(parent, tag, className, text) {
  const el = parent.appendChild(document.createElement(tag));
  el.className = className || '';
  el.textContent = text || '';
  return el;
}

function notify(text) {
  notice.firstChild.textContent = text;
  notice.hidden = false;
}

const tracks = document.querySelector('#tracks');
for (const track of DATA.tracks) {
  add(tracks, 'div', 'name', `${track.view_id} (${track.app})`);
  const bar = add(tracks, 'div', 'bar');
  for (const {start_ms, end_ms, label} of track.segments) {
    const el = add(bar, 'i');
    el.style.cssText = `left:${percent(start_ms)};width:${percent(end_ms - start_ms)};background:${color(label)}`;
    el.title = label;
    el.dataset.start = start_ms;
  }
  bar.onclick = e => {
    const box = bar.getBoundingClientRect();
    const ms = e.target.dataset.start ?? (e.clientX - box.left) / box.width * DATA.duration_ms;
    player.currentTime = ms / 1000;
  };
  const legend = add(tracks, 'div', 'legend');
  for (const label of new Set(track.segments.map(s => s.label))) {
    const item = add(legend, 'span');
    add(item, 'b').style.background = color(label);
    item.append(label);
  }
}

document.title = DATA.file_name || document.title;
document.querySelector('#title').textContent = document.title;
document.querySelector('#player').append(player);
player.controls = true;
picker.accept = `${DATA.kind}/*`;
player.ontimeupdate = () => tracks.style.setProperty('--at', percent(player.currentTime * 1000));
player.onerror = () => notify(`The browser cannot play ${player.currentSrc}. Choose ${expected} on this computer.`);
picker.onchange = () => {
  const file = picker.files[0];
  if (!file) return;
  notice.hidden = true;
  player.src = URL.createObjectURL(file);
  if (DATA.file_name && file.name !== DATA.file_name) {
    notify(`The chosen file is "${file.name}". The MMIF names ${expected}.`);
  }
};
if (DATA.src) player.src = DATA.src;
else notify(`The location of the ${DATA.kind} is not known. Choose ${expected} on this computer.`);
</script>
</html>
